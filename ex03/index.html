<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 03 - Colors and Opacity</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Color Swatch Palette -->
  <div class="swatch-named">Named</div>
  <div class="swatch-hex">HEX</div>
  <div class="swatch-rgb">RGB</div>
  <div class="swatch-rgba">RGBA</div>

  <!-- Opacity Comparison: Fades children -->
  <div class="box-opacity">
    <p>Text inside opacity element</p>
  </div>

  <!-- RGBA Comparison: Isolates background transparency -->
  <div class="box-rgba">
    <p>Text inside RGBA element</p>
  </div>

</body>
</html>
