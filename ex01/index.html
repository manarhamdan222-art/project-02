<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 01 - Positioning</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Pinned navigation bar -->
  <nav class="navbar">
    <span>Navigation Bar</span>
  </nav>

  <!-- Card container -->
  <div class="card-container">
    <!-- Absolute notification badge anchored inside card corner -->
    <span class="badge">New</span>
    <p>Card Content</p>
  </div>

  <!-- Fixed back-to-top button at bottom-right -->
  <button class="back-to-top">Top</button>

</body>
</html>
